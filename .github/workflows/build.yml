# Build (and optionally test) the apps on a GitHub-hosted macOS runner (#87).
# Started by hand for now: Actions ▸ Build ▸ Run workflow (choose the branch), or
#   gh workflow run build.yml --ref <branch> [-f tests=true]
# No real key: Secret.h comes from Secret.h.example and SecretEncoding.h is absent (the committed example encoding
# is used). Nothing is published: no DMG here (see #87).
name: Build

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Also run the unit tests (BikePlannerTests, RideAnalyzerTests)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SIGN: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      DEST: -destination platform=macOS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the number of commits (scripts/set_build_info.sh)

      - name: Xcode version
        run: xcodebuild -version

      - name: Secret.h from the example (no real key)
        run: cp BikePlanner/Secret.h.example BikePlanner/Secret.h

      - name: Build BikePlanner
        run: |
          set -o pipefail
          xcodebuild -project BikePlanner.xcodeproj -scheme BikePlanner $DEST $SIGN build 2>&1 \
            | tee build-bikeplanner.log | grep -E "(error|warning):|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED" build-bikeplanner.log

      - name: Build RideAnalyzer
        if: hashFiles('BikePlanner.xcodeproj/xcshareddata/xcschemes/RideAnalyzer.xcscheme') != ''
        run: |
          set -o pipefail
          xcodebuild -project BikePlanner.xcodeproj -scheme RideAnalyzer $DEST $SIGN build 2>&1 \
            | tee build-rideanalyzer.log | grep -E "(error|warning):|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED" build-rideanalyzer.log

      - name: Unit tests of RideAnalyzer
        if: inputs.tests && hashFiles('BikePlanner.xcodeproj/xcshareddata/xcschemes/RideAnalyzer.xcscheme') != ''
        run: |
          set -o pipefail
          xcodebuild -project BikePlanner.xcodeproj -scheme RideAnalyzer $DEST $SIGN \
            -only-testing:RideAnalyzerTests -resultBundlePath ra-tests.xcresult test 2>&1 \
            | tee test-rideanalyzer.log | grep -E "Test case .*(failed|expected)|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED" test-rideanalyzer.log

      - name: Unit tests of BikePlanner
        if: inputs.tests && !cancelled()
        run: |
          set -o pipefail
          xcodebuild -project BikePlanner.xcodeproj -scheme BikePlanner $DEST $SIGN \
            -only-testing:BikePlannerTests -resultBundlePath bp-tests.xcresult test 2>&1 \
            | tee test-bikeplanner.log | grep -E "Test case .*(failed|expected)|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED" test-bikeplanner.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            *.log
            *.xcresult
          if-no-files-found: ignore
          retention-days: 7
